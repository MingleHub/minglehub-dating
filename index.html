<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MingleHub Dating</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #e91e63;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        p {
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
            width: 100%;
        }
        .btn:hover {
            background: #c2185b;
            transform: translateY(-2px);
        }
        .match-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fff0f5;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            color: #c2185b;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to MingleHub ❤️</h1>
        <p>Find someone special.</p>
        <button class="btn" onclick="findMatch()">Find My Match</button>
        <div id="matchDisplay" class="match-box"></div>
    </div>

    <script>
        function findMatch() {
            const matches = ["Alex, 24 🌟", "Taylor, 27 🎨", "Jordan, 26 🚀", "Morgan, 25 📚", "Sam, 28 🎸"];
            const randomMatch = matches[Math.floor(Math.random() * matches.length)];
            const display = document.getElementById("matchDisplay");
            
            display.style.display = "block";
            display.innerHTML = `✨ Success! Your match is: ${randomMatch}`;
        }
    </script>

</body>
</html>
